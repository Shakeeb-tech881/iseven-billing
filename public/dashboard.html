<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — I7SEVEN MOBILES</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<div class="topbar">
  <div class="brand">
    <img src="logo.png" alt="I7SEVEN">
    <nav class="navlinks">
      <a href="/">New invoice</a>
      <a href="dashboard.html" class="on">Dashboard</a>
    </nav>
  </div>
  <div class="bar-actions">
    <span class="role-tag" id="role-tag" style="display:none"></span>
    <button class="btn ghost" id="btn-logout">Sign out</button>
    <button class="btn" onclick="location.href='/'">+ New invoice</button>
  </div>
</div>

<div class="dash">
  <div class="stats" id="stats"></div>

  <div class="searchbar">
    <div class="srow">
      <div class="field" style="margin:0">
        <label>Search</label>
        <input class="big code" id="q" placeholder="Type an NIC, IMEI, invoice number, name or phone…" autofocus>
      </div>
      <div class="field" style="margin:0">
        <label>Search in</label>
        <select id="field">
          <option value="all">Everything</option>
          <option value="nic">NIC number</option>
          <option value="imei">IMEI / serial</option>
          <option value="number">Invoice number</option>
          <option value="name">Customer name</option>
        </select>
      </div>
      <div class="field" style="margin:0"><label>From</label><input type="date" id="from"></div>
      <div class="field" style="margin:0"><label>To</label><input type="date" id="to"></div>
      <button class="btn ghost" id="btn-reset">Reset</button>
    </div>
    <div class="chips">
      <button class="chip on" data-preset="">All time</button>
      <button class="chip" data-preset="today">Today</button>
      <button class="chip" data-preset="week">Last 7 days</button>
      <button class="chip" data-preset="month">This month</button>
    </div>
  </div>

  <div class="results">
    <div class="rhead">
      <span id="rcount">Loading\u2026</span>
      <span id="rsum"></span>
    </div>
    <!-- Who has actually received their invoice. Counts are for the
         invoices listed below, and each one filters the list. -->
    <div class="estrip" id="estrip"></div>
    <table class="rt">
      <thead>
        <tr>
          <th>Invoice</th>
          <th>Customer</th>
          <th>NIC</th>
          <th>IMEI / serial</th>
          <th>Email</th>
          <th class="r">Date</th>
          <th class="r">Total</th>
          <th class="r">Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="nores" id="nores" style="display:none">No invoices match that search.</div>
    <div class="loadwrap">
      <button class="btn ghost sm" id="loadmore" style="display:none">Load more</button>
    </div>
  </div>
</div>

<!-- full invoice viewer -->
<div class="viewer" id="viewer">
  <div class="vwrap">
    <div class="vbar">
      <span class="t" id="vtitle"></span>
      <!-- a class, not an inline style, so the phone rules can wrap it -->
      <span class="vacts">
        <button class="btn ghost sm" id="v-close">Close</button>
        <button class="btn ghost sm" id="v-edit">Edit</button>
        <button class="btn ghost sm" id="v-email">Send email</button>
        <button class="btn ghost sm" id="v-pdf">Download PDF</button>
        <button class="btn sm" id="v-print">Print</button>
      </span>
    </div>
    <div class="paper" id="vpaper"></div>
  </div>
</div>

<script src="core.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let timer = null;

  /* ---------------- stats ---------------- */
  async function loadStats() {
    try {
      const s = await I7.api("/api/stats");
      const c = s.currency || "LKR";
      $("stats").innerHTML = `
        <div class="stat hero">
          <div class="k">Sales this month</div>
          <div class="v">${c} ${I7.money(s.month_total_c)}</div>
        </div>
        <div class="stat">
          <div class="k">Invoices this month</div>
          <div class="v">${s.month_count} <small>/ ${s.today_count} today</small></div>
        </div>
        <div class="stat">
          <div class="k">VAT this month</div>
          <div class="v">${c} ${I7.money(s.month_vat_c)}</div>
        </div>
        <div class="stat">
          <div class="k">SSCL this month</div>
          <div class="v">${c} ${I7.money(s.month_sscl_c)}</div>
        </div>
        <div class="stat">
          <div class="k">Warranties in force</div>
          <div class="v">${s.active_warranties} <small>items</small></div>
        </div>
        <div class="stat">
          <div class="k">Invoices on record</div>
          <div class="v">${s.all_count}</div>
        </div>`;
    } catch (e) {
      $("stats").innerHTML = `<div class="stat"><div class="k">Stats</div><div class="v"><small>${I7.esc(e.message)}</small></div></div>`;
    }
  }

  /* ---------------- search ---------------- */
  async function search() {
    const p = new URLSearchParams({
      q: $("q").value.trim(),
      field: $("field").value,
      limit: String(pageLimit)
    });
    if ($("from").value) p.set("from", $("from").value);
    if ($("to").value)   p.set("to", $("to").value);

    try {
      const all = await I7.api("/api/invoices?" + p.toString());
      lastRows = all;
      renderStrip(all);
      const g = EGROUPS.find(([k]) => k === efilter);
      const rows = efilter === "all" ? all
                 : efilter === "noaddr" ? all.filter((r) => !r.cust_email)
                 : all.filter((r) => r.cust_email && g[2](r));
      const total = rows.reduce((a, r) => a + r.total_c, 0);
      /* A full page back means there are probably more behind it. Saying
         so matters, because the total beside this line only adds up what
         is actually loaded. */
      const capped = all.length >= pageLimit;
      /* "4 invoices today" was a lie whenever older unsent ones were in
         the list. Count what is actually from today and say both. */
      const todayStr = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Colombo" });
      const isToday = (r) => r.created_at &&
        new Date(r.created_at).toLocaleDateString("en-CA", { timeZone: "Asia/Colombo" }) === todayStr;
      const cashier = document.body.dataset.role === "cashier";
      const nToday = all.filter(isToday).length;
      const older  = all.length - nToday;
      /* The breakdown is only meaningful for a cashier, whose list is
         "today plus the unfinished". An admin is just browsing. */
      const detail = !cashier ? ""
                   : older ? ` \u2014 ${nToday} today, ${older} still to send`
                           : " today";
      $("rcount").textContent = all.length
        ? `${all.length} invoice${all.length === 1 ? "" : "s"}${detail}`
          + (capped ? " \u2014 showing the most recent" : "")
        : (cashier ? "Nothing to do" : "No results");
      $("loadmore").style.display = capped ? "inline-block" : "none";
      /* The takings sum is removed from the page for cashiers, so it may
         not exist; writing to it unguarded crashed the whole search. */
      const rsum = $("rsum");
      if (rsum) rsum.textContent = rows.length ? `Total ${rows[0].currency || "LKR"} ${I7.money(total)}` : "";
      $("nores").style.display = rows.length ? "none" : "block";

      paint(rows);
    } catch (e) {
      $("rcount").textContent = e.message;
      $("rows").innerHTML = "";
    }
  }

  function paint(rows) {
      $("nores").style.display = rows.length ? "none" : "block";
      $("rows").innerHTML = rows.map((r) => {
        const modeTag = { none: "No VAT", vat: "VAT", vat_sscl: "VAT+SSCL", incl: "VAT incl." }[r.tax_mode] || "";
        return `<tr data-id="${r.id}">
          <td class="num">${I7.esc(r.number)}<span class="sub">${r.item_count} item${r.item_count === 1 ? "" : "s"}</span></td>
          <td>${I7.esc(r.cust_name)}${r.cust_phone ? `<span class="sub">${I7.esc(r.cust_phone)}</span>` : ""}</td>
          <td class="mono">${r.cust_nic ? I7.esc(r.cust_nic) : "<span style='opacity:.35'>\u2014</span>"}</td>
          <td class="mono" style="font-size:11px">${r.imeis ? I7.esc(r.imeis) : "<span style='opacity:.35'>\u2014</span>"}</td>
          <td style="font-size:11px">${r.cust_email ? I7.esc(r.cust_email) : "<span style='opacity:.35'>\u2014</span>"}${epill(r.email_status, r.email_error)}${estamp(r)}</td>
          <td class="r mono">${I7.niceDate(r.issue_date)}<span class="sub"><span class="tag">${modeTag}</span></span></td>
          ${document.body.dataset.role === "cashier" ? "" : `<td class="r mono" style="font-weight:700">${I7.money(r.total_c)}</td>`}
          <td class="r acts">
             ${r.cust_email && NEEDS_SENDING.includes(r.email_status || "not_sent")
               ? `<button class="mini send" data-send="${r.id}" data-no="${I7.esc(r.number)}"
                          data-to="${I7.esc(r.cust_email)}">${
                    (r.email_attempts || 0) > 0 ? "Resend" : "Send"}</button>` : ""}
             <button class="mini" data-edit="${r.id}">Edit</button>
             ${document.body.dataset.role === "cashier" ? "" :
               `<button class="mini del" data-del="${r.id}" data-no="${I7.esc(r.number)}">Delete</button>`}
           </td>
        </tr>`;
      }).join("");
  }

  /* How many rows to ask for. "Load more" raises it rather than paging,
     which keeps the totals and the status counts covering everything on
     screen instead of one page of it. */
  const PAGE = 500;
  let pageLimit = PAGE;

  /* The last fetch, so the status chips filter instantly. */
  let lastRows = [];
  function applyFilter() {
    renderStrip(lastRows);
    const g = EGROUPS.find(([k]) => k === efilter);
    const rows = efilter === "all" ? lastRows
               : efilter === "noaddr" ? lastRows.filter((r) => !r.cust_email)
               : lastRows.filter((r) => r.cust_email && g[2](r));
    /* The sum has to follow the filter, or picking "Problem" leaves the
       total of every invoice sitting beside three rows. */
    const rsum = $("rsum");
    if (rsum) rsum.textContent = rows.length
      ? `Total ${rows[0].currency || "LKR"} ${I7.money(rows.reduce((a, r) => a + r.total_c, 0))}` : "";
    $("nores").style.display = rows.length ? "none" : "block";
    paint(rows);
  }

  $("loadmore").addEventListener("click", async () => {
    pageLimit += PAGE;
    $("loadmore").disabled = true;
    $("loadmore").textContent = "Loading\u2026";
    await search();
    $("loadmore").disabled = false;
    $("loadmore").textContent = "Load more";
  });

  $("estrip").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ef]");
    if (!b) return;
    efilter = b.dataset.ef;
    applyFilter();
  });

  function debounced() {
    pageLimit = PAGE;              // a new search starts from the top
    clearTimeout(timer); timer = setTimeout(search, 180);
  }

  ["q"].forEach((id) => $(id).addEventListener("input", debounced));
  ["field", "from", "to"].forEach((id) => $(id).addEventListener("change", search));

  $("btn-reset").addEventListener("click", () => {
    $("q").value = ""; $("field").value = "all"; $("from").value = ""; $("to").value = "";
    document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c.dataset.preset === ""));
    search(); $("q").focus();
  });

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
      chip.classList.add("on");
      const t = I7.isoToday();
      const p = chip.dataset.preset;
      if (p === "today")      { $("from").value = t; $("to").value = t; }
      else if (p === "week")  { $("from").value = I7.addDays(t, -6); $("to").value = t; }
      else if (p === "month") { $("from").value = t.slice(0, 7) + "-01"; $("to").value = t; }
      else                    { $("from").value = ""; $("to").value = ""; }
      search();
    });
  });

  /* ---------------- viewer ---------------- */
  async function openInvoice(id) {
    try {
      const inv = await I7.api("/api/invoices/" + id);
      inv.totals = {
        subtotal_c: inv.subtotal_c, discount_c: inv.discount_c, net_c: inv.net_c,
        sscl_c: inv.sscl_c, taxable_c: inv.taxable_c, vat_c: inv.vat_c,
        incl_vat_c: inv.incl_vat_c, total_c: inv.total_c
      };
      $("vpaper").innerHTML = I7.renderPaper(inv);
      viewingId = inv.id;
      $("v-email").style.display = inv.cust_email ? "inline-block" : "none";
      $("v-email").disabled = false;
      $("v-email").textContent = "Send email";
      $("vtitle").textContent = inv.number + " \u00b7 " + inv.cust_name;
      $("viewer").classList.add("show");
      document.body.style.overflow = "hidden";
    } catch (e) { alert(e.message); }
  }

  function closeViewer() {
    $("viewer").classList.remove("show");
    document.body.style.overflow = "";
  }

  let viewingId = null;

  $("rows").addEventListener("click", async (e) => {
    const ed = e.target.closest("[data-edit]");
    if (ed) { location.href = "/?edit=" + ed.dataset.edit; return; }

    /* Sending from the list, so a cashier can finish an invoice that
       never reached the customer without opening it first. */
    const snd = e.target.closest("[data-send]");
    if (snd) {
      /* The address from the row's own data, not scraped out of the
         cell, which also holds the badge and the timestamp. */
      if (!confirm(`Send invoice ${snd.dataset.no} to:\n\n${snd.dataset.to}\n\nIs that address correct?`)) return;
      snd.disabled = true; snd.textContent = "Sending\u2026";
      try {
        const out = await I7.api("/api/invoices/" + snd.dataset.send + "/email", { method: "POST" });
        if (!out.sent) alert("It did not send. " + (out.error || ""));
      } catch (err) { alert(err.message); }
      search();
      return;
    }

    const del = e.target.closest("[data-del]");
    if (del) {
      const no = del.dataset.no;
      if (!confirm(`Delete invoice ${no}?\n\nThis removes it and its items permanently. The number ${no} will not be reused, so your sequence will show a gap.`)) return;
      try {
        await I7.api("/api/invoices/" + del.dataset.del, { method: "DELETE" });
        loadStats(); search();
      } catch (err) { alert(err.message); }
      return;
    }

    const tr = e.target.closest("tr[data-id]");
    if (tr) openInvoice(tr.dataset.id);
  });

  $("v-edit").addEventListener("click", () => {
    if (viewingId) location.href = "/?edit=" + viewingId;
  });

  $("v-pdf").addEventListener("click", () => {
    if (viewingId) window.open("/api/invoices/" + viewingId + "/pdf", "_blank");
  });

  $("v-email").addEventListener("click", async () => {
    if (!viewingId) return;
    const btn = $("v-email");
    btn.disabled = true; btn.textContent = "Sending\u2026";
    try {
      const r = await I7.api("/api/invoices/" + viewingId + "/email", { method: "POST" });
      btn.textContent = r.sent ? "Sent to " + r.to : "Failed";
      if (!r.sent) alert(r.error || "The email did not send.");
      search();
    } catch (e) {
      btn.textContent = "Failed"; alert(e.message);
    }
    setTimeout(() => { btn.disabled = false; btn.textContent = "Send email"; }, 2500);
  });
  $("v-close").addEventListener("click", closeViewer);
  $("v-print").addEventListener("click", () => window.print());
  $("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) closeViewer(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("viewer").classList.contains("show")) closeViewer();
    if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  });

  /* The states that mean the customer still has not got it. Matches the
     same list on the server. */
  const NEEDS_SENDING = ["not_sent", "failed", "bounced", "blocked",
                         "bad_address", "spam", "soft_bounce"];

  /* When it went, and when it landed, in the shop's own clock. */
  function estamp(r) {
    if (!r.email_sent_at) return "";
    const sent = `Sent ${I7.niceDateTime(r.email_sent_at)}`;
    const got  = r.email_delivered_at
      ? `<br>Delivered ${I7.niceDateTime(r.email_delivered_at)}` : "";
    const tries = (r.email_attempts || 0) > 1 ? ` (attempt ${r.email_attempts})` : "";
    return `<span class="estamp">${sent}${tries}${got}</span>`;
  }

  /* Counts for the list below, each one a filter. */
  const EGROUPS = [
    ["all",       "All",         () => true],
    ["delivered", "Delivered",   (r) => r.email_status === "delivered"],
    ["onway",     "On the way",  (r) => r.email_status === "sent" || r.email_status === "soft_bounce"],
    ["problem",   "Problem",     (r) => ["failed","bounced","blocked","bad_address","spam"].includes(r.email_status)],
    ["notsent",   "Not sent",    (r) => !r.email_status || r.email_status === "not_sent"],
    ["noaddr",    "No address",  (r) => !r.cust_email]
  ];
  let efilter = "all";

  function renderStrip(rows) {
    $("estrip").innerHTML = EGROUPS.map(([k, label, test]) => {
      const n = k === "all" ? rows.length : rows.filter((r) => r.cust_email && test(r)).length;
      const nn = k === "noaddr" ? rows.filter((r) => !r.cust_email).length : n;
      if (k !== "all" && nn === 0) return "";
      return `<button class="echip ${k}${efilter === k ? " on" : ""}" data-ef="${k}">
                ${label} <b>${nn}</b></button>`;
    }).join("");
  }

  function epill(st, reason) {
    if (!st || st === "not_sent") return "";
    /* "Sent" only means Brevo took the message. The rest come back from
       Brevo's webhook once it knows what really happened. */
    const map = { sent: ["sent", "Sent"], delivered: ["ok", "Delivered"],
                  bounced: ["failed", "Bounced \u2014 wrong address"],
                  blocked: ["failed", "Blocked"], spam: ["warn", "Marked spam"],
                  soft_bounce: ["warn", "Not yet delivered"],
                  unsubscribed: ["warn", "Unsubscribed"],
                  failed: ["failed", "Failed"],
                  bad_address: ["failed", "Bad address"], no_address: ["", "No address"],
                  disabled: ["", "Sending off"] };
    const m = map[st] || ["", st];
    /* The mail server's own words, on hover, so nobody has to open Brevo
       to find out why a message did not arrive. */
    const why = reason ? ` title="${I7.esc(reason)}"` : "";
    return `<span class="epill ${m[0]}"${why}>${m[1]}</span>`;
  }

  $("btn-logout").addEventListener("click", async () => {
    await fetch("/api/logout").catch(() => {});
    location.href = "/login.html";
  });

  (async function boot() {
    let sess = { role: "admin", required: false };
    try { sess = await fetch("/api/session").then((r) => r.json()); } catch {}

    if (sess.required && !sess.authed) {
      location.href = "/login.html?next=" + encodeURIComponent(location.pathname);
      return;
    }

    const tag = $("role-tag");
    if (sess.required) {
      tag.style.display = "inline-block";
      tag.textContent = sess.role;
      tag.classList.toggle("cashier", sess.role === "cashier");
    }

    /* Cashiers may look up warranties but see no money figures. */
    if (sess.role === "cashier") {
      $("stats").remove();
      $("rsum").remove();
      document.querySelectorAll("table.rt th").forEach((th) => {
        if (th.textContent.trim() === "Total") th.remove();
      });
      document.body.dataset.role = "cashier";
      /* The date range works for cashiers too: within their scope — today,
         plus anything not yet delivered — they can pick any period. */
      $("q").placeholder = "Search \u2014 NIC, IMEI, number, name\u2026";
    } else {
      loadStats();
    }
    search();
  })();
})();
</script>
