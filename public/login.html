<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — I7SEVEN MOBILE</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:var(--ink);
  }
  .login-card{width:100%;max-width:360px}
  .login-card .mark{text-align:center;margin-bottom:6px}
  .login-card .mark img{height:34px;width:auto}
  .login-card .sub{
    text-align:center;font-size:9px;font-weight:700;letter-spacing:.42em;
    text-transform:uppercase;color:var(--on-dark);margin-bottom:30px;padding-left:5px;
  }
  .login-card .box{
    background:var(--ink-2);border:1px solid var(--ink-3);border-radius:2px;padding:20px;
  }
  .login-card h1{
    margin:0 0 16px;font-size:10px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--lime);
  }
  .login-card .btn{width:100%;margin-top:12px;padding:11px}
  .login-card .note{
    margin-top:16px;text-align:center;font-size:11px;color:var(--on-dark-soft);line-height:1.5;
  }
</style>

<div class="login-wrap">
  <div class="login-card">
    <div class="mark"><img src="logo.png" alt="I7SEVEN"></div>
    <div class="sub">Mobile</div>

    <div class="box">
      <h1>Staff sign in</h1>
      <p style="margin:-8px 0 14px;font-size:11.5px;color:var(--on-dark-soft);line-height:1.5">Enter your own password. Admin and cashier passwords are different.</p>
      <div class="err" id="err"></div>
      <div class="field">
        <label for="pw">Shop password</label>
        <input type="password" id="pw" autocomplete="current-password" autofocus>
      </div>
      <button class="btn" id="go">Sign in</button>
    </div>

    <p class="note">This system holds customer NIC numbers.<br>Do not share the password outside the shop.</p>
  </div>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const next = new URLSearchParams(location.search).get("next") || "/";

  function showErr(msg) {
    const e = $("err");
    if (!msg) { e.classList.remove("show"); return; }
    e.textContent = msg;
    e.classList.add("show");
  }

  async function submit() {
    const pw = $("pw").value;
    if (!pw) return showErr("Enter the password.");
    showErr("");
    $("go").disabled = true;
    $("go").textContent = "Checking\u2026";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Sign in failed.");
      /* Cashiers have no dashboard, so send them to the till. */
      const dest = (data.role === "cashier" && next.indexOf("dashboard") !== -1) ? "/" : next;
      location.href = dest;
    } catch (e) {
      showErr(e.message);
      $("go").disabled = false;
      $("go").textContent = "Sign in";
      $("pw").value = "";
      $("pw").focus();
    }
  }

  $("go").addEventListener("click", submit);
  $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });

  /* If auth is switched off, or a session is already valid, skip the form. */
  fetch("/api/session")
    .then((r) => r.json())
    .then((s) => { if (!s.required || s.authed) location.href = next; })
    .catch(() => {});
})();
</script>
